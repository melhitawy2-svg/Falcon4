name: Falcon VPN Android Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Root
        run: |
          ROOT=$(find . -type f -name "build.gradle.kts" | head -n 1 | xargs dirname)
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "Found: $ROOT"
          ls -la $ROOT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
